apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "order-service.fullname" . }}-test-connection"
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      imagePullPolicy: IfNotPresent

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL

      command:
        - sh
        - -c
        - >-
          curl
          --fail
          --silent
          --show-error
          --max-time 10
          http://{{ include "order-service.fullname" . }}:{{ .Values.service.port }}/health