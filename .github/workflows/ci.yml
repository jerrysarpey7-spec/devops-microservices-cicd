name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python — ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - order-service
          - payment-service
          - notification-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest -q

  container-build:
    name: Container — ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: local/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-quality:
    name: Helm validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Lint all charts
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            user-service \
            order-service \
            payment-service \
            notification-service
          do
            echo "Linting ${service}"
            helm lint "deploy/helm/${service}"
          done

      - name: Render all charts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/rendered

          for service in \
            user-service \
            order-service \
            payment-service \
            notification-service
          do
            helm template \
              "${service}" \
              "deploy/helm/${service}" \
              --namespace devops-microservices \
              > "/tmp/rendered/${service}.yaml"

            test -s "/tmp/rendered/${service}.yaml"
          done

  terraform-quality:
    name: Terraform validation and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform without backend
        run: |
          terraform \
            -chdir=infra/terraform/environments/dev \
            init \
            -backend=false

      - name: Validate Terraform
        run: |
          terraform \
            -chdir=infra/terraform/environments/dev \
            validate

      - name: Run TFLint
        run: |
          tflint \
            --chdir=infra/terraform/modules/github-actions \
            --init

          tflint \
            --chdir=infra/terraform/modules/github-actions

          tflint \
            --chdir=infra/terraform/environments/dev \
            --init

          tflint \
            --chdir=infra/terraform/environments/dev

      - name: Run Checkov
        run: |
          python -m pip install \
            --disable-pip-version-check \
            checkov==3.3.19

          checkov \
            -d infra/terraform/environments/dev \
            --framework terraform \
            --compact